<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Neo Forge Games</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon">◆</span> Neo Forge Games
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="news.html">New Games</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="profile.html">Profile</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Contact Us</h2>
      <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent! (This is a demo)');">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" class="btn" style="width:100%;">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2026 Neo Forge Games. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
