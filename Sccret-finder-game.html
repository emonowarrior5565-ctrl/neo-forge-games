<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Finder Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .level-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .story {
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 1.05rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 2px #00d2ff;
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
        }

        .hint {
            margin-top: 15px;
            color: #ffcc00;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .attempts {
            margin-top: 10px;
            color: #ff6b6b;
            font-size: 0.9rem;
        }

        .result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .final-score {
            font-size: 1.4rem;
            margin: 20px 0;
        }

        .restart-btn {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Secret Finder</h1>
        <p class="subtitle">Find the hidden secret things!</p>

        <div id="game-area">
            <div class="level-badge" id="level-badge">LEVEL 1</div>
            <div class="story" id="story"></div>
            
            <input type="text" id="answer" placeholder="Type the secret thing..." autocomplete="off">
            <button onclick="checkAnswer()">Submit</button>
            
            <div class="hint" id="hint"></div>
            <div class="attempts" id="attempts"></div>
            <div class="result" id="result"></div>
        </div>

        <div id="end-screen" class="hidden">
            <h2>Game Over!</h2>
            <div class="final-score" id="final-score"></div>
            <button class="restart-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            {
                level: 1,
                story: "You are in a dark room. There is a table, a chair, and a box.\nSomething shiny is inside the box...",
                secret: "key",
                hint: "It opens locks"
            },
            {
                level: 2,
                story: "You enter a garden. Flowers are everywhere.\nUnder one red rose something is buried...",
                secret: "coin",
                hint: "It is round and metallic"
            },
            {
                level: 3,
                story: "You are in a kitchen. Pots, pans and a fridge.\nInside the fridge behind the milk...",
                secret: "map",
                hint: "It shows the way"
            },
            {
                level: 4,
                story: "You reach an old library. Books everywhere.\nOne book has something hidden between pages...",
                secret: "letter",
                hint: "Someone wrote a message"
            },
            {
                level: 5,
                story: "You are near a river. There is a big rock.\nUnder the rock something is shining...",
                secret: "ring",
                hint: "People wear it on finger"
            },
            {
                level: 6,
                story: "You enter a cave. It's dark and cold.\nOn the wall there is a secret carving...",
                secret: "code",
                hint: "Numbers or letters that open something"
            },
            {
                level: 7,
                story: "You are in a school classroom.\nInside the teacher's desk drawer...",
                secret: "diary",
                hint: "Someone writes daily secrets in it"
            },
            {
                level: 8,
                story: "You climb a mountain. There is a small cave.\nInside a wooden chest...",
                secret: "treasure",
                hint: "Gold, jewels, very valuable"
            },
            {
                level: 9,
                story: "You are in a haunted house.\nBehind a broken painting on the wall...",
                secret: "photo",
                hint: "An old picture of someone"
            },
            {
                level: 10,
                story: "Final level! You reach an ancient temple.\nIn the center of the temple on a pedestal...",
                secret: "amulet",
                hint: "A magical pendant with powers"
            }
        ];

        let currentLevel = 0;
        let score = 0;
        let attempts = 3;

        function loadLevel() {
            const level = levels[currentLevel];
            document.getElementById("level-badge").textContent = `LEVEL ${level.level}`;
            document.getElementById("story").textContent = level.story;
            document.getElementById("hint").textContent = "";
            document.getElementById("result").textContent = "";
            document.getElementById("answer").value = "";
            document.getElementById("attempts").textContent = `Attempts left: ${attempts}`;
            document.getElementById("answer").focus();
        }

        function checkAnswer() {
            const userAnswer = document.getElementById("answer").value.toLowerCase().trim();
            const correct = levels[currentLevel].secret;

            if (userAnswer === correct) {
                document.getElementById("result").textContent = "✅ Correct! You found the secret!";
                document.getElementById("result").style.color = "#00ff9d";
                score++;
                
                setTimeout(() => {
                    currentLevel++;
                    attempts = 3;
                    
                    if (currentLevel < levels.length) {
                        loadLevel();
                    } else {
                        endGame();
                    }
                }, 1200);
            } else {
                attempts--;
                document.getElementById("result").textContent = "❌ Wrong!";
                document.getElementById("result").style.color = "#ff6b6b";
                document.getElementById("hint").textContent = "Hint: " + levels[currentLevel].hint;
                document.getElementById("attempts").textContent = `Attempts left: ${attempts}`;

                if (attempts <= 0) {
                    document.getElementById("result").textContent = `❌ Out of attempts! Secret was: ${correct}`;
                    setTimeout(() => {
                        currentLevel++;
                        attempts = 3;
                        if (currentLevel < levels.length) {
                            loadLevel();
                        } else {
                            endGame();
                        }
                    }, 1800);
                }
            }
        }

        function endGame() {
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("end-screen").classList.remove("hidden");
            
            let message = "";
            if (score === 10) message = "Perfect! You are a true Secret Finder! 🏆";
            else if (score >= 7) message = "Great job! 👏";
            else message = "Try again to find all secrets!";

            document.getElementById("final-score").innerHTML = 
                `You found <strong>\( {score}/10</strong> secrets!<br><br> \){message}`;
        }

        function restartGame() {
            currentLevel = 0;
            score = 0;
            attempts = 3;
            document.getElementById("end-screen").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            loadLevel();
        }

        // Enter key se bhi submit ho
        document.getElementById("answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                checkAnswer();
            }
        });

        // Game start
        loadLevel();
    </script>
</body>
</html>
